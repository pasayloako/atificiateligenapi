<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NovaGPT</title><style>
:root{--ink:#202123;--muted:#6e6e80;--line:#e5e5e5;--soft:#f7f7f8;--blue:#10a37f;--blue-dark:#087f63;--black:#343541}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff}button,input{font:inherit}.app{min-height:100dvh;max-width:1180px;margin:auto;display:flex}.rail{width:260px;background:#202123;color:#fff;padding:15px 12px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;gap:10px;align-items:center;font-weight:750;font-size:17px;letter-spacing:-.03em;padding:8px}.spark{width:31px;height:31px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:9px;font-size:20px}.new{border:1px solid #565760;background:transparent;color:#fff;border-radius:8px;padding:12px;text-align:left;cursor:pointer}.new:hover{background:#2b2c2f}.chat-list{overflow:auto}.chat-link{display:block;border:0;width:100%;background:transparent;text-align:left;padding:11px;border-radius:7px;cursor:pointer;color:#ececf1}.chat-link:hover,.chat-link.active{background:#343541}.chat-link b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-link small{color:#a7a7b0;font-size:10px}.account{margin-top:auto;border-top:1px solid #4b4c52;padding:14px 8px 0;font-size:12px}.account span{display:block;color:#a7a7b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.logout{border:0;background:transparent;color:#c8c8d0;padding:8px 0;cursor:pointer;font-size:12px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.head{height:67px;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.head h1{font-size:17px;margin:0;letter-spacing:-.03em}.login{border:0;border-radius:7px;background:var(--blue);color:#fff;padding:10px 16px;font-weight:650;cursor:pointer}.login:hover{background:var(--blue-dark)}.thread{flex:1;overflow:auto;padding:42px 8%;display:flex;flex-direction:column;gap:22px}.welcome{margin:auto;text-align:center}.welcome h2{font-size:42px;letter-spacing:-.06em;margin:0 0 10px}.welcome p{color:var(--muted);margin:0}.msg{display:flex;gap:11px;max-width:86%;position:relative}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{width:30px;height:30px;flex:0 0 auto;border-radius:7px;background:#e8f7f3;color:#087f63;display:grid;place-items:center;font-size:11px;font-weight:800}.msg.user .avatar{background:#343541;color:#fff}.bubble{padding:12px 15px;border-radius:8px;background:#f7f7f8;line-height:1.58;font-size:15px;white-space:pre-wrap}.msg.user .bubble{background:#343541;color:#fff}.meta{font-size:10px;color:#9a9aa5;margin:5px}.copy{border:0;background:transparent;color:var(--blue-dark);font-size:11px;cursor:pointer;padding:3px 5px}.composer-wrap{padding:16px 8% 25px;border-top:1px solid var(--line)}.composer{display:flex;gap:10px;border:1px solid #c8c8d0;border-radius:10px;padding:10px 10px 10px 14px;box-shadow:0 2px 8px #0000000b}.composer input{flex:1;min-width:0;border:0;outline:0}.send{border:0;background:var(--blue);color:#fff;border-radius:7px;padding:0 17px;cursor:pointer}.send:disabled{opacity:.5}.gate{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:5}.auth-shell{width:min(440px,calc(100vw - 32px));text-align:center;padding:30px 34px}.auth-mark{width:44px;height:44px;border-radius:50%;background:#202123;color:#fff;display:grid;place-items:center;font-size:27px;margin:0 auto 25px}.auth-shell h1{font-size:30px;font-weight:650;letter-spacing:-.05em;margin:0 0 10px}.auth-shell>p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 auto 26px}.auth-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:22px}.auth-tab{flex:1;border:0;border-bottom:2px solid transparent;background:#fff;color:#8a8a96;padding:12px 8px;cursor:pointer;font-weight:650}.auth-tab.active{border-color:var(--blue);color:var(--ink)}.auth-form{text-align:left}.auth-form label{display:block;font-size:12px;font-weight:650;color:#4d4d58;margin:14px 0 6px}.auth-form input{display:block;width:100%;padding:12px 13px;border:1px solid #cfcfd6;border-radius:7px;outline:0;background:#fff}.auth-form input:focus{border-color:var(--blue);box-shadow:0 0 0 2px #10a37f22}.auth-submit{width:100%;margin-top:17px;padding:12px}.auth-error{color:#c44747;font-size:12px;min-height:18px;text-align:left;margin:12px 0 0}.auth-foot{color:#9a9aa5;font-size:11px;margin-top:20px}@media(max-width:760px){.rail{display:none}.head{padding:16px 20px}.thread{padding:28px 17px}.composer-wrap{padding:12px 14px 18px}.welcome h2{font-size:38px}.auth-shell{padding:26px 20px}}
</style></head><body><div class="gate" id="gate"><div class="auth-shell"><div class="auth-mark">✦</div><h1>Welcome to NovaGPT</h1><p id="authSubtitle">Your intelligent workspace for learning, creating, and solving problems.</p><div class="auth-tabs"><button class="auth-tab active" id="showLogin" type="button">Log in</button><button class="auth-tab" id="showSignup" type="button">Sign up</button></div><form class="auth-form" id="authForm"><label for="authName">Name</label><input id="authName" required minlength="2" maxlength="80" placeholder="Enter your name" autocomplete="username"><label for="authPassword">Password</label><input id="authPassword" required minlength="8" type="password" placeholder="At least 8 characters" autocomplete="current-password"><div id="confirmWrap" style="display:none"><label for="authConfirm">Confirm password</label><input id="authConfirm" minlength="8" type="password" placeholder="Re-enter your password" autocomplete="new-password"></div><p class="auth-error" id="authError"></p><button class="login auth-submit" id="authSubmit" type="submit">Continue</button></form><div class="auth-foot">By continuing, you agree to use NovaGPT responsibly.</div></div></div><div class="app"><aside class="rail"><div class="brand"><span class="spark">✦</span> NovaGPT</div><button class="new" id="newChat">＋ New chat</button><div class="chat-list" id="chatList"></div><div class="account"><b id="userName">Guest</b><span id="userEmail">Name and password account</span><button class="logout" id="logout">Sign out</button></div></aside><main class="main"><header class="head"><h1 id="chatTitle">New chat</h1></header><section class="thread" id="thread"><div class="welcome"><h2>How can I help?</h2><p>Ask NovaGPT anything. Your conversation is saved to your account.</p><div class="suggest"><button data-text="Hi, who made you?">Who made you?</button><button data-text="Help me practice programming.">Practice programming</button><button data-text="Explain a difficult topic simply.">Explain a topic</button></div></div></section><div class="composer-wrap"><form class="composer" id="composer"><input id="input" placeholder="Message NovaGPT…" autocomplete="off"><button class="send" id="send" type="submit">Send</button></form></div></main></div><script>
const API_BASE=window.NOVA_API_BASE||'';let me=null,chats=[],selected=null,messages=[];const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path,opt={}){const r=await fetch(API_BASE+path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||r.status);return r.status===204?null:r.json()}
function renderChats(){$('#chatList').innerHTML=chats.map(c=>`<button class="chat-link ${selected===c.id?'active':''}" data-id="${c.id}"><b>${esc(c.title)}</b><small>${new Date(c.updatedAt).toLocaleDateString()}</small></button>`).join('');document.querySelectorAll('.chat-link').forEach(b=>b.onclick=()=>selectChat(b.dataset.id));}
function renderMessages(){const t=$('#thread');if(!messages.length){t.innerHTML='<div class="welcome"><h2>How can I help?</h2><p>Ask NovaGPT anything. Your conversation is saved to your account.</p><div class="suggest"><button data-text="Hi, who made you?">Who made you?</button><button data-text="Help me practice programming.">Practice programming</button></div></div>';bindSuggestions();return}t.innerHTML=messages.map(m=>`<article class="msg ${m.from==='user'?'user':'ai'}"><div class="avatar">${m.from==='user'?'You':'N'}</div><div><div class="bubble">${esc(m.text)}</div><div class="meta">${m.from==='user'?'You':'NovaGPT'} · ${new Date(m.ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} ${m.from!=='user'?`<button class="copy" data-copy="${encodeURIComponent(m.text)}">Copy</button>`:''}</div></div></article>`).join('');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(decodeURIComponent(b.dataset.copy)).then(()=>{b.textContent='Copied'}));t.scrollTop=t.scrollHeight;}
function bindSuggestions(){document.querySelectorAll('[data-text]').forEach(b=>b.onclick=()=>send(b.dataset.text));}
let authMode='login';function setAuthMode(mode){authMode=mode;const signup=mode==='signup';$('#confirmWrap').style.display=signup?'block':'none';$('#authSubmit').textContent=signup?'Create account':'Continue';$('#authSubtitle').textContent=signup?'Create your NovaGPT account with a name and password.':'Log in to continue to your NovaGPT workspace.';$('#authPassword').autocomplete=signup?'new-password':'current-password';$('#showLogin').classList.toggle('active',!signup);$('#showSignup').classList.toggle('active',signup);$('#authError').textContent='';}
async function handleAuth(e){e.preventDefault();const name=$('#authName').value.trim(),password=$('#authPassword').value,confirm=$('#authConfirm').value;if(authMode==='signup'&&password!==confirm){$('#authError').textContent='Passwords do not match.';return}try{await api(authMode==='signup'?'/api/signup':'/api/login',{method:'POST',body:JSON.stringify({name,password})});$('#authForm').reset();await load();}catch(error){$('#authError').textContent=error.message}}
async function load(){const r=await api('/api/me');if(!r.user){$('#gate').style.display='grid';return}me=r.user;$('#gate').style.display='none';$('#userName').textContent=me.name;$('#userEmail').textContent='Name and password account';const x=await api('/api/chats');chats=x.chats;if(!chats.length){const n=await api('/api/chats',{method:'POST',body:JSON.stringify({title:'New chat'})});chats=[n.chat]}selected=selected||chats[0].id;renderChats();await selectChat(selected);}
async function selectChat(id){selected=id;const r=await api('/api/chats/'+id+'/messages');messages=r.messages;$('#chatTitle').textContent=r.chat.title;renderChats();renderMessages();}
async function send(text){text=(text||$('#input').value).trim();if(!text)return;if(!selected){const n=await api('/api/chats',{method:'POST',body:JSON.stringify({title:text.slice(0,40)})});selected=n.chat.id;chats.unshift(n.chat)}$('#input').value='';$('#send').disabled=true;try{const r=await api('/api/chats/'+selected+'/messages',{method:'POST',body:JSON.stringify({text})});messages.push(...r.messages);renderMessages();}catch(e){alert(e.message)}finally{$('#send').disabled=false}}
$('#composer').onsubmit=e=>{e.preventDefault();send()};$('#newChat').onclick=async()=>{const r=await api('/api/chats',{method:'POST',body:JSON.stringify({title:'New chat'})});chats.unshift(r.chat);await selectChat(r.chat.id)};$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};$('#showLogin').onclick=()=>setAuthMode('login');$('#showSignup').onclick=()=>setAuthMode('signup');$('#authForm').onsubmit=handleAuth;setAuthMode('login');bindSuggestions();load().catch(()=>{$('#gate').style.display='grid'});
</script></body></html>
