<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NovaGPT</title><style>
:root{--ink:#17191d;--muted:#7a808a;--line:#e8ebef;--soft:#f6f7f9;--blue:#2864dc;--blue2:#eaf0ff}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff}button,input{font:inherit}.app{min-height:100dvh;max-width:1120px;margin:auto;display:flex}.rail{width:250px;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px;letter-spacing:-.04em}.spark{width:31px;height:31px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:10px;font-size:20px}.new{border:0;background:#1c2026;color:#fff;border-radius:12px;padding:12px;cursor:pointer;font-weight:700}.chat-list{overflow:auto}.chat-link{display:block;border:0;width:100%;background:transparent;text-align:left;padding:11px;border-radius:11px;cursor:pointer;color:#444}.chat-link:hover,.chat-link.active{background:var(--blue2);color:var(--blue)}.chat-link b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-link small{color:var(--muted);font-size:10px}.account{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;font-size:12px}.account span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.logout{border:0;background:transparent;color:var(--blue);padding:8px 0;cursor:pointer;font-size:12px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.head{height:76px;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.head h1{font-size:18px;margin:0;letter-spacing:-.04em}.login{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:10px 15px;font-weight:700;cursor:pointer}.thread{flex:1;overflow:auto;padding:40px 7%;display:flex;flex-direction:column;gap:20px}.welcome{margin:auto;text-align:center}.welcome h2{font-size:42px;letter-spacing:-.07em;margin:0 0 10px}.welcome p{color:var(--muted);margin:0}.msg{display:flex;gap:10px;max-width:86%;position:relative}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{width:30px;height:30px;flex:0 0 auto;border-radius:10px;background:var(--blue2);color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:800}.msg.user .avatar{background:#20242a;color:#fff}.bubble{padding:12px 15px;border-radius:17px;background:#f2f4f7;line-height:1.55;font-size:15px;white-space:pre-wrap}.msg.user .bubble{background:#20242a;color:#fff;border-bottom-right-radius:4px}.msg.ai .bubble{border-bottom-left-radius:4px}.meta{font-size:10px;color:#a3a8af;margin:5px}.copy{border:0;background:transparent;color:var(--blue);font-size:11px;cursor:pointer;padding:3px 5px}.composer-wrap{padding:16px 7% 24px;border-top:1px solid var(--line)}.composer{display:flex;gap:10px;border:1px solid #dfe3e9;border-radius:18px;padding:8px 10px 8px 15px;box-shadow:0 5px 20px #1720330d}.composer input{flex:1;min-width:0;border:0;outline:0}.send{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:0 17px;cursor:pointer}.send:disabled{opacity:.5}.gate{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:5}.gate-card{text-align:center;width:min(400px,90vw)}.gate-card h1{font-size:48px;letter-spacing:-.08em;margin:0 0 10px}.gate-card p{color:var(--muted);line-height:1.5}.suggest{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:22px}.suggest button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 12px;color:#5e6671;cursor:pointer}@media(max-width:760px){.rail{display:none}.head{padding:16px 20px}.thread{padding:28px 17px}.composer-wrap{padding:12px 14px 18px}.welcome h2{font-size:38px}}
</style></head><body><div class="gate" id="gate"><div class="gate-card"><div class="spark" style="margin:auto">Рюд</div><h1>NovaGPT</h1><p id="authSubtitle">Create an account with your name and password to save your chats.</p><div style="display:flex;gap:8px;justify-content:center;margin:18px 0"><button class="suggest" id="showLogin" type="button">Log in</button><button class="suggest" id="showSignup" type="button">Sign up</button></div><form id="authForm"><input id="authName" required minlength="2" maxlength="80" placeholder="Name" autocomplete="username" style="display:block;width:100%;padding:12px;border:1px solid #dfe3e9;border-radius:10px;margin:8px 0"><input id="authPassword" required minlength="8" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" style="display:block;width:100%;padding:12px;border:1px solid #dfe3e9;border-radius:10px;margin:8px 0"><input id="authConfirm" minlength="8" type="password" placeholder="Confirm password" autocomplete="new-password" style="display:none;width:100%;padding:12px;border:1px solid #dfe3e9;border-radius:10px;margin:8px 0"><p id="authError" style="color:#c44747;font-size:13px;min-height:18px"></p><button class="login" id="authSubmit" type="submit">Log in</button></form></div></div><div class="app"><aside class="rail"><div class="brand"><span class="spark">Рюд</span> NovaGPT</div><button class="new" id="newChat">№╝І New chat</button><div class="chat-list" id="chatList"></div><div class="account"><b id="userName">Guest</b><span id="userEmail">Name and password account</span><button class="logout" id="logout">Sign out</button></div></aside><main class="main"><header class="head"><h1 id="chatTitle">New chat</h1><button class="login" id="mobileLogin" style="display:none">Account</button></header><section class="thread" id="thread"><div class="welcome"><h2>How can I help?</h2><p>Ask NovaGPT anything. Your AI conversation is saved to your account.</p><div class="suggest"><button data-text="Hi, who made you?">Who made you?</button><button data-text="Help me practice programming.">Practice programming</button><button data-text="Explain a difficult topic simply.">Explain a topic</button></div></div></section><div class="composer-wrap"><form class="composer" id="composer"><input id="input" placeholder="Message NovaGPTРђд" autocomplete="off"><button class="send" id="send" type="submit">Send</button></form></div></main></div><script>
const API_BASE=window.NOVA_API_BASE||'';let me=null,chats=[],selected=null,messages=[];const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path,opt={}){const r=await fetch(API_BASE+path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||r.status);return r.status===204?null:r.json()}
function renderChats(){ $('#chatList').innerHTML=chats.map(c=>`<button class="chat-link ${selected===c.id?'active':''}" data-id="${c.id}"><b>${esc(c.title)}</b><small>${new Date(c.updatedAt).toLocaleDateString()}</small></button>`).join('');document.querySelectorAll('.chat-link').forEach(b=>b.onclick=()=>selectChat(b.dataset.id));}
function renderMessages(){const t=$('#thread');if(!messages.length){t.innerHTML='<div class="welcome"><h2>How can I help?</h2><p>Ask NovaGPT anything. Your conversation is saved to your account.</p><div class="suggest"><button data-text="Hi, who made you?">Who made you?</button><button data-text="Help me practice programming.">Practice programming</button></div></div>';bindSuggestions();return}t.innerHTML=messages.map(m=>`<article class="msg ${m.from==='user'?'user':'ai'}"><div class="avatar">${m.from==='user'?'You':'N'}</div><div><div class="bubble">${esc(m.text)}</div><div class="meta">${m.from==='user'?'You':'NovaGPT'} ┬и ${new Date(m.ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} ${m.from!=='user'?`<button class="copy" data-copy="${encodeURIComponent(m.text)}">Copy</button>`:''}</div></div></article>`).join('');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(decodeURIComponent(b.dataset.copy)).then(()=>{b.textContent='Copied'}));t.scrollTop=t.scrollHeight;}
function bindSuggestions(){document.querySelectorAll('[data-text]').forEach(b=>b.onclick=()=>send(b.dataset.text));}
let authMode='login';
function setAuthMode(mode){authMode=mode;const signup=mode==='signup';$('#authConfirm').style.display=signup?'block':'none';$('#authSubmit').textContent=signup?'Create account':'Log in';$('#authSubtitle').textContent=signup?'Create an account with your name and password to save your chats.':'Log in with your name and password to continue.';$('#authPassword').autocomplete=signup?'new-password':'current-password';$('#authError').textContent='';}
async function handleAuth(e){e.preventDefault();const name=$('#authName').value.trim(),password=$('#authPassword').value,confirm=$('#authConfirm').value;if(authMode==='signup'&&password!==confirm){$('#authError').textContent='Passwords do not match.';return}try{await api(authMode==='signup'?'/api/signup':'/api/login',{method:'POST',body:JSON.stringify({name,password})});$('#authForm').reset();await load();}catch(error){$('#authError').textContent=error.message}}
async function load(){const r=await api('/api/me');if(!r.user){$('#gate').style.display='grid';return}me=r.user;$('#gate').style.display='none';$('#userName').textContent=me.name;$('#userEmail').textContent='Name and password account';const x=await api('/api/chats');chats=x.chats;if(!chats.length){const n=await api('/api/chats',{method:'POST',body:JSON.stringify({title:'New chat'})});chats=[n.chat]}selected=selected||chats[0].id;renderChats();await selectChat(selected);}
async function selectChat(id){selected=id;const r=await api('/api/chats/'+id+'/messages');messages=r.messages;$('#chatTitle').textContent=r.chat.title;renderChats();renderMessages();}
async function send(text){text=(text||$('#input').value).trim();if(!text)return;if(!selected){const n=await api('/api/chats',{method:'POST',body:JSON.stringify({title:text.slice(0,40)})});selected=n.chat.id;chats.unshift(n.chat)}$('#input').value='';$('#send').disabled=true;try{const r=await api('/api/chats/'+selected+'/messages',{method:'POST',body:JSON.stringify({text})});messages.push(...r.messages);renderMessages();}catch(e){alert(e.message)}finally{$('#send').disabled=false}}
$('#composer').onsubmit=e=>{e.preventDefault();send()};$('#newChat').onclick=async()=>{const r=await api('/api/chats',{method:'POST',body:JSON.stringify({title:'New chat'})});chats.unshift(r.chat);await selectChat(r.chat.id)};$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};$('#showLogin').onclick=()=>setAuthMode('login');$('#showSignup').onclick=()=>setAuthMode('signup');$('#authForm').onsubmit=handleAuth;setAuthMode('login');bindSuggestions();load().catch(()=>{$('#gate').style.display='grid'});
</script></body></html>
