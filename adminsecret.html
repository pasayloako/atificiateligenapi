<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaGPT Admin</title><style>
:root{--ink:#17191d;--muted:#7a808a;--line:#e8ebef;--blue:#2864dc;--soft:#f6f7f9}*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.app{min-height:100dvh;max-width:1250px;margin:auto;background:#fff;display:grid;grid-template-columns:310px 1fr}.sidebar{border-right:1px solid var(--line);padding:20px 12px;overflow:auto}.brand{font-weight:800;font-size:18px;letter-spacing:-.04em;padding:0 10px 22px}.brand i{font-style:normal;background:var(--blue);color:#fff;border-radius:9px;padding:7px;margin-right:8px}.user{padding:15px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}.user b{color:var(--ink);display:block}.list{padding-top:15px}.row{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:12px;padding:13px 11px;margin:3px 0;cursor:pointer}.row:hover,.row.active{background:#edf2ff}.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:50px 18px;font-size:13px;line-height:1.5}.main{display:flex;flex-direction:column;min-width:0}.top{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:12px}.top h1{font-size:17px;margin:0}.token{margin-left:auto;border:1px solid var(--line);padding:9px 11px;border-radius:9px;width:220px;font-size:12px}.thread{flex:1;overflow:auto;padding:30px 7%;display:flex;flex-direction:column;gap:17px}.bubble-row{display:flex;gap:10px;max-width:75%}.bubble-row.admin{margin-left:auto;flex-direction:row-reverse}.avatar{width:29px;height:29px;border-radius:9px;background:#eaf0ff;color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:800;flex:0 0 auto}.bubble{background:#f0f2f5;border-radius:16px;padding:11px 14px;white-space:pre-wrap;line-height:1.5;font-size:14px}.admin .bubble{background:#2b63d6;color:#fff}.meta{color:#a0a6af;font-size:10px;margin:4px}.delete{border:0;background:transparent;color:#d14a4a;font-size:10px;cursor:pointer;margin-left:7px}.reply{border-top:1px solid var(--line);padding:14px 7%;display:flex;gap:10px}.reply textarea{flex:1;resize:none;border:1px solid #dfe3e9;border-radius:13px;padding:12px;outline:0;min-height:48px}.reply button{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:0 20px;cursor:pointer}@media(max-width:760px){.app{display:block}.sidebar{height:40vh;border-right:0;border-bottom:1px solid var(--line)}.token{width:130px}.thread,.reply{padding-left:16px;padding-right:16px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><i>✦</i> NovaGPT Admin</div><div class="user" id="user"><b>Selected user</b>Choose a conversation to inspect user ID and memory.</div><div class="list" id="list"></div></aside><main class="main"><header class="top"><h1 id="title">Conversation inbox</h1><input class="token" id="token" type="password" placeholder="ADMIN_TOKEN"><button onclick="saveToken()">Save</button></header><section class="thread" id="thread"><div class="empty">Enter your ADMIN_TOKEN, then select a user conversation.</div></section><form class="reply" id="reply"><textarea id="input" placeholder="Reply as admin…" disabled></textarea><button id="send" disabled>Send</button></form></main></div><script>
const API_BASE=window.NOVA_API_BASE||'';let token=localStorage.getItem('nova-admin-token')||'',data=[],selected=null;$('#token').value=token;function $(s){return document.querySelector(s)}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path,opt={}){const r=await fetch(API_BASE+path,{headers:{'Content-Type':'application/json','x-admin-token':token,...(opt.headers||{})},...opt});if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||r.status);return r.status===204?null:r.json()}
function saveToken(){token=$('#token').value.trim();localStorage.setItem('nova-admin-token',token);load()}
function renderList(){if(!data.length){$('#list').innerHTML='<div class="empty">No user chats yet.</div>';return}$('#list').innerHTML=data.map(c=>`<button class="row ${selected===c.id?'active':''}" data-id="${c.id}"><b>${esc(c.user?.name||'Guest')} · ${esc(c.title)}</b><small>${esc(c.user?.email||c.userId)}</small></button>`).join('');document.querySelectorAll('.row').forEach(b=>b.onclick=()=>select(b.dataset.id));}
function renderThread(c){$('#title').textContent=c.title+' · '+(c.user?.name||'Guest');$('#user').innerHTML=`<b>${esc(c.user?.name||'Guest')}</b>${esc(c.user?.email||'No email')}<br><span>User ID: ${esc(c.userId)}</span>`;$('#thread').innerHTML=c.messages.map(m=>`<article class="bubble-row ${m.from==='admin'?'admin':''}"><div class="avatar">${m.from==='admin'?'A':'U'}</div><div><div class="bubble">${esc(m.text)}</div><div class="meta">${m.from==='admin'?'You':'User'} · ${new Date(m.ts).toLocaleString()} ${m.from==='admin'?`<button class="delete" data-delete="${m.id}">Unsend</button>`:''}</div></div></article>`).join('')||'<div class="empty">No messages.</div>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>unsend(b.dataset.delete));$('#thread').scrollTop=$('#thread').scrollHeight;$('#input').disabled=false;$('#send').disabled=false}
async function load(){try{const r=await api('/api/admin/conversations');data=r.chats;renderList();if(selected){const c=data.find(x=>x.id===selected);if(c)renderThread(c)}}catch(e){$('#thread').innerHTML='<div class="empty">'+esc(e.message)+'<br>Enter a valid ADMIN_TOKEN.</div>';}}
async function select(id){selected=id;renderList();const c=data.find(x=>x.id===id);if(c)renderThread(c)}async function unsend(id){if(!confirm('Unsend this admin message?'))return;try{await api('/api/admin/messages/'+id,{method:'DELETE'});await load();}catch(e){alert(e.message)}}$('#reply').onsubmit=async e=>{e.preventDefault();const text=$('#input').value.trim();if(!text||!selected)return;try{await api('/api/admin/chats/'+selected+'/messages',{method:'POST',body:JSON.stringify({text})});$('#input').value='';await load();}catch(e){alert(e.message)}};load();setInterval(load,4000);
</script></body></html>
